<svg xmlns="http://www.w3.org/2000/svg" width="720" height="56" viewBox="0 0 720 56">
  <defs>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="45%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <filter id="ripple" x="-5%" y="-50%" width="110%" height="200%">
      <feTurbulence type="turbulence" baseFrequency="0.015 0.05" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" dur="7s" values="0.015 0.05;0.022 0.07;0.015 0.05" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="720" height="56" rx="12" fill="url(#depth)"/>

  <path d="M0 10 Q60 4 120 10 T240 10 T360 10 T480 10 T600 10 T720 10" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity="0.22"/>
  <path d="M0 18 Q60 12 120 18 T240 18 T360 18 T480 18 T600 18 T720 18" fill="none" stroke="#a5f3fc" stroke-width="1" opacity="0.12"/>

  <circle cx="40" cy="42" r="3" fill="#ecfeff" opacity="0.35">
    <animate attributeName="cy" values="48;8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="46" r="2" fill="#ecfeff" opacity="0.3">
    <animate attributeName="cy" values="50;6" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <text x="20" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="url(#ink)" filter="url(#ripple)">ARVP - buck converter + PCB from the ground up</text>

  <!-- simple AUV silhouette (right), swimming -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="602,10; 618,6; 602,10; 586,12; 602,10" dur="4s" repeatCount="indefinite"/>
    <!-- wake bubbles behind -->
    <circle cx="100" cy="26" r="2" fill="#ecfeff" opacity="0.35">
      <animate attributeName="cx" values="100;118" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="30" r="1.5" fill="#ecfeff" opacity="0.3">
      <animate attributeName="cx" values="108;126" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <!-- slight pitch while moving -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 52 26; 2 52 26; -2 52 26" dur="4s" repeatCount="indefinite"/>
      <ellipse cx="52" cy="26" rx="48" ry="14" fill="url(#hull)"/>
      <ellipse cx="18" cy="26" rx="10" ry="10" fill="#9ca3af"/>
      <path d="M40 14 L52 2 L64 14 Z" fill="#2563eb"/>
      <circle cx="28" cy="12" r="5" fill="#111827"/>
      <circle cx="28" cy="40" r="5" fill="#111827"/>
      <circle cx="72" cy="18" r="4" fill="#111827"/>
      <circle cx="72" cy="34" r="4" fill="#111827"/>
      <path d="M6 22 L-4 16 M6 30 L-4 36" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <rect x="38" y="20" width="18" height="12" rx="2" fill="#0ea5e9" opacity="0.45"/>
    </g>
  </g>
</svg>


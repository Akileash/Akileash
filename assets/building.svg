<svg xmlns="http://www.w3.org/2000/svg" width="760" height="128" viewBox="0 0 760 128">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#58a6ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="cyanInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="amberInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d1d9"/>
      <stop offset="100%" stop-color="#6e7681"/>
    </linearGradient>
    <filter id="ripple" x="-4%" y="-40%" width="108%" height="180%">
      <feTurbulence type="turbulence" baseFrequency="0.014 0.045" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" dur="8s" values="0.014 0.045;0.02 0.06;0.014 0.045" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="127" rx="14" fill="url(#glass)" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="126" rx="13" fill="url(#sheen)"/>

  <text x="22" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1.5">BUILDING</text>

  <line x1="22" y1="40" x2="738" y2="40" stroke="#30363d" stroke-width="1"/>
  <rect x="22" y="52" width="3" height="26" rx="1.5" fill="#58a6ff" opacity="0.85"/>
  <text x="34" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="url(#cyanInk)" filter="url(#ripple)">ARVP - buck converter + PCB from the ground up</text>

  <g>
    <animateTransform attributeName="transform" type="translate" values="640,46; 652,43; 640,46; 628,48; 640,46" dur="4.5s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 48 22; 2 48 22; -2 48 22" dur="4.5s" repeatCount="indefinite"/>
      <ellipse cx="48" cy="22" rx="38" ry="10" fill="url(#hull)"/>
      <ellipse cx="20" cy="22" rx="7" ry="7" fill="#8b949e"/>
      <path d="M38 13 L48 3 L58 13 Z" fill="#388bfd"/>
      <circle cx="30" cy="12" r="3.2" fill="#0d1117"/>
      <circle cx="30" cy="32" r="3.2" fill="#0d1117"/>
      <circle cx="64" cy="16" r="2.8" fill="#0d1117"/>
      <circle cx="64" cy="28" r="2.8" fill="#0d1117"/>
      <path d="M10 18 L2 14 M10 26 L2 30" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <rect x="36" y="17" width="14" height="8" rx="1.5" fill="#58a6ff" opacity="0.4"/>
    </g>
    <circle cx="90" cy="22" r="1.5" fill="#79c0ff" opacity="0.35">
      <animate attributeName="cx" values="90;104" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="22" y1="88" x2="738" y2="88" stroke="#30363d" stroke-width="1"/>
  <rect x="22" y="98" width="3" height="26" rx="1.5" fill="#e3b341" opacity="0.85"/>
  <text x="34" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="url(#amberInk)">CentreMass - decommissioned the parts for hackathon</text>

  <g transform="translate(668,86)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 30 38; 4 30 38; -4 30 38" dur="2.3s" repeatCount="indefinite"/>
      <circle cx="10" cy="36" r="7.5" fill="#0d1117" stroke="#e3b341" stroke-width="1.7"/>
      <circle cx="50" cy="36" r="7.5" fill="#0d1117" stroke="#e3b341" stroke-width="1.7"/>
      <circle cx="10" cy="36" r="2" fill="#e3b341"/>
      <circle cx="50" cy="36" r="2" fill="#e3b341"/>
      <rect x="16" y="29" width="8" height="6" rx="1" fill="#bb8009"/>
      <rect x="36" y="29" width="8" height="6" rx="1" fill="#bb8009"/>
      <rect x="14" y="22" width="32" height="6" rx="1" fill="#8b949e" opacity="0.85"/>
      <rect x="20" y="23" width="11" height="4" rx="1" fill="#388bfd"/>
      <line x1="18" y1="22" x2="18" y2="10" stroke="#c9d1d9" stroke-width="1.2"/>
      <line x1="42" y1="22" x2="42" y2="10" stroke="#c9d1d9" stroke-width="1.2"/>
      <line x1="24" y1="22" x2="24" y2="10" stroke="#c9d1d9" stroke-width="0.9"/>
      <line x1="36" y1="22" x2="36" y2="10" stroke="#c9d1d9" stroke-width="0.9"/>
      <rect x="16" y="7" width="28" height="4" rx="1" fill="#8b949e"/>
      <rect x="20" y="11" width="7" height="8" rx="1.5" fill="#1f6feb"/>
      <rect x="33" y="11" width="7" height="8" rx="1.5" fill="#1f6feb"/>
      <rect x="23" y="2" width="14" height="5" rx="1" fill="#e6edf3" stroke="#6e7681" stroke-width="0.9"/>
    </g>
  </g>
</svg>

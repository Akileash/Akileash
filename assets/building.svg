<svg xmlns="http://www.w3.org/2000/svg" width="760" height="158" viewBox="0 0 760 158">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#58a6ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="cyanInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="amberInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d7de"/>
      <stop offset="55%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#484f58"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e7681"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <linearGradient id="acrylic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d1d9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="50%" stop-color="#484f58"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <filter id="ripple" x="-4%" y="-40%" width="108%" height="180%">
      <feTurbulence type="turbulence" baseFrequency="0.014 0.045" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" dur="8s" values="0.014 0.045;0.02 0.06;0.014 0.045" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="157" rx="14" fill="url(#glass)" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="156" rx="13" fill="url(#sheen)"/>

  <text x="22" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1.5">BUILDING</text>

  <line x1="22" y1="40" x2="738" y2="40" stroke="#30363d" stroke-width="1"/>
  <rect x="22" y="52" width="3" height="26" rx="1.5" fill="#58a6ff" opacity="0.85"/>
  <text x="34" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="url(#cyanInk)" filter="url(#ripple)">ARVP - buck converter + PCB from the ground up</text>

  <!-- AUV: ARVP-style - silver hull, blue shark fin, thruster ducts, claw -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="636,36; 646,34; 636,36; 626,38; 636,36" dur="5s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-1.2 52 26; 1.2 52 26; -1.2 52 26" dur="5s" repeatCount="indefinite"/>
      <!-- black frame rails -->
      <rect x="22" y="20" width="68" height="2.5" rx="1" fill="#21262d"/>
      <rect x="22" y="30" width="68" height="2.5" rx="1" fill="#21262d"/>
      <!-- main aluminum pressure hull -->
      <rect x="30" y="17" width="50" height="18" rx="9" fill="url(#hull)"/>
      <ellipse cx="30" cy="26" rx="8" ry="9" fill="#b1bac4"/>
      <ellipse cx="80" cy="26" rx="7" ry="9" fill="#8b949e"/>
      <!-- side clear tube (electronics) -->
      <rect x="48" y="19" width="18" height="14" rx="3" fill="#58a6ff" opacity="0.2" stroke="#79c0ff" stroke-width="0.7" stroke-opacity="0.45"/>
      <line x1="52" y1="22" x2="52" y2="30" stroke="#f85149" stroke-width="1" opacity="0.55"/>
      <line x1="56" y1="22" x2="56" y2="30" stroke="#f85149" stroke-width="1" opacity="0.45"/>
      <!-- bright blue shark fin -->
      <path d="M50 17 L58 2 L66 17 Z" fill="#1f6feb"/>
      <path d="M53 17 L58 6 L63 17 Z" fill="#388bfd"/>
      <!-- thruster ducts (black rings) -->
      <g stroke="#0d1117" stroke-width="2" fill="none">
        <circle cx="36" cy="11" r="5"/>
        <circle cx="36" cy="41" r="5"/>
        <circle cx="78" cy="12" r="4.5"/>
        <circle cx="78" cy="40" r="4.5"/>
      </g>
      <g fill="#21262d">
        <circle cx="36" cy="11" r="2.4"/>
        <circle cx="36" cy="41" r="2.4"/>
        <circle cx="78" cy="12" r="2.1"/>
        <circle cx="78" cy="40" r="2.1"/>
      </g>
      <!-- tiny thruster number accents -->
      <text x="33.5" y="12.5" font-family="Segoe UI, Arial, sans-serif" font-size="4.5" font-weight="700" fill="#f85149">0</text>
      <text x="76" y="41.5" font-family="Segoe UI, Arial, sans-serif" font-size="4" font-weight="700" fill="#f85149">4</text>
      <!-- blue claw / gripper -->
      <path d="M22 23 L12 18 L10 20 L20 24 Z" fill="#1f6feb"/>
      <path d="M22 29 L12 34 L10 32 L20 28 Z" fill="#1f6feb"/>
      <circle cx="22" cy="26" r="2" fill="#388bfd"/>
      <!-- sensor tubes on top-front -->
      <rect x="38" y="13" width="3" height="5" rx="1" fill="#21262d"/>
      <rect x="42" y="13" width="3" height="5" rx="1" fill="#21262d"/>
      <circle cx="39.5" cy="12.5" r="1.2" fill="#1f6feb"/>
      <circle cx="43.5" cy="12.5" r="1.2" fill="#1f6feb"/>
      <!-- hull brand mark hint -->
      <circle cx="40" cy="26" r="2.2" fill="#da3633" opacity="0.85"/>
    </g>
    <circle cx="100" cy="26" r="1.3" fill="#79c0ff" opacity="0.3">
      <animate attributeName="cx" values="100;112" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="22" y1="88" x2="738" y2="88" stroke="#30363d" stroke-width="1"/>
  <rect x="22" y="98" width="3" height="26" rx="1.5" fill="#e3b341" opacity="0.85"/>
  <text x="34" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="url(#amberInk)">CentreMass - decommissioned the parts for hackathon</text>

  <!-- CentreMass: two-wheel stack, acrylic decks, batteries, top mass -->
  <g transform="translate(678,88) scale(0.92)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2.5 30 34; 2.5 30 34; -2.5 30 34" dur="2.4s" repeatCount="indefinite"/>
      <!-- wheels -->
      <circle cx="11" cy="38" r="9" fill="url(#tire)" stroke="#e3b341" stroke-width="1.5"/>
      <circle cx="49" cy="38" r="9" fill="url(#tire)" stroke="#e3b341" stroke-width="1.5"/>
      <circle cx="11" cy="38" r="3.2" fill="#e3b341"/>
      <circle cx="49" cy="38" r="3.2" fill="#e3b341"/>
      <circle cx="11" cy="38" r="1.2" fill="#21262d"/>
      <circle cx="49" cy="38" r="1.2" fill="#21262d"/>
      <!-- axle / motor housings -->
      <rect x="18" y="32" width="9" height="7" rx="1" fill="#9a6700"/>
      <rect x="33" y="32" width="9" height="7" rx="1" fill="#9a6700"/>
      <!-- lower acrylic deck -->
      <rect x="15" y="25" width="30" height="5" rx="0.8" fill="url(#acrylic)" stroke="#8b949e" stroke-width="0.5"/>
      <!-- control board -->
      <rect x="21" y="25.5" width="12" height="4" rx="0.6" fill="#1f6feb"/>
      <circle cx="23.5" cy="27.5" r="0.6" fill="#3fb950"/>
      <!-- standoffs -->
      <line x1="18" y1="25" x2="18" y2="11" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="42" y1="25" x2="42" y2="11" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="24" y1="25" x2="24" y2="11" stroke="#8b949e" stroke-width="1" stroke-linecap="round"/>
      <line x1="36" y1="25" x2="36" y2="11" stroke="#8b949e" stroke-width="1" stroke-linecap="round"/>
      <!-- battery cells -->
      <rect x="21" y="14" width="7" height="10" rx="2" fill="#1f6feb"/>
      <rect x="32" y="14" width="7" height="10" rx="2" fill="#1f6feb"/>
      <line x1="22.5" y1="15.5" x2="26.5" y2="15.5" stroke="#79c0ff" stroke-width="0.6" opacity="0.7"/>
      <line x1="33.5" y1="15.5" x2="37.5" y2="15.5" stroke="#79c0ff" stroke-width="0.6" opacity="0.7"/>
      <!-- upper acrylic deck -->
      <rect x="16" y="9" width="28" height="4" rx="0.8" fill="url(#acrylic)" stroke="#8b949e" stroke-width="0.5"/>
      <!-- top mass enclosure -->
      <rect x="22" y="2" width="16" height="7" rx="1" fill="#e6edf3" stroke="#6e7681" stroke-width="0.8"/>
      <line x1="25" y1="4" x2="35" y2="4" stroke="#8b949e" stroke-width="0.5"/>
      <line x1="25" y1="6.5" x2="35" y2="6.5" stroke="#8b949e" stroke-width="0.5"/>
    </g>
  </g>
</svg>
